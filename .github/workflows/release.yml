name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifact_glob: 'electron/dist/*.AppImage'
          - os: windows-latest
            platform: win
            artifact_glob: 'electron/dist/*.exe'
          - os: macos-latest
            platform: mac
            artifact_glob: 'electron/dist/*.dmg'

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            server/client/package-lock.json
            server/package-lock.json
            electron/package-lock.json

      # ── Build the React web client ─────────────────────────────────────────
      - name: Install web client dependencies
        working-directory: server/client
        run: npm ci

      - name: Build web client
        working-directory: server/client
        run: npm run build

      # ── Install server dependencies ────────────────────────────────────────
      - name: Install server dependencies
        working-directory: server
        run: npm ci --omit=dev

      # ── Build Electron app ─────────────────────────────────────────────────
      - name: Install Electron dependencies
        working-directory: electron
        run: npm ci

      - name: Build Electron app (${{ matrix.platform }})
        working-directory: electron
        run: npm run build:${{ matrix.platform }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Disable Mac code signing for unsigned builds
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # ── Upload to GitHub Release ───────────────────────────────────────────
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_glob }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
