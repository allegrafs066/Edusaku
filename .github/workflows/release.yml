name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifact_glob: 'electron/dist/*.AppImage'
            ollama_url: 'https://github.com/ollama/ollama/releases/latest/download/ollama-linux-amd64'
            ollama_bin: 'electron/bin/ollama-linux'
          - os: windows-latest
            platform: win
            artifact_glob: 'electron/dist/*.exe'
            ollama_url: 'https://github.com/ollama/ollama/releases/latest/download/ollama-windows-amd64.exe'
            ollama_bin: 'electron/bin/ollama-win.exe'
          - os: macos-latest
            platform: mac
            artifact_glob: 'electron/dist/*.dmg'
            ollama_url: 'https://github.com/ollama/ollama/releases/latest/download/ollama-darwin'
            ollama_bin: 'electron/bin/ollama-mac'

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            server/client/package-lock.json
            server/package-lock.json
            electron/package-lock.json

      # ── Download GGUF model from HuggingFace ──────────────────────────────
      - name: Create models directory
        run: mkdir -p server/models
        shell: bash

      - name: Download Gemma 4 GGUF model
        run: |
          curl -L "https://huggingface.co/bartowski/google_gemma-4-E2B-it-GGUF/resolve/main/google_gemma-4-E2B-it-Q4_K_M.gguf" \
            -o server/models/gemma4.gguf \
            --retry 3 \
            --retry-delay 5
        shell: bash

      # ── Build the React web client ────────────────────────────────────────
      - name: Install web client dependencies
        working-directory: server/client
        run: npm ci

      - name: Build web client
        working-directory: server/client
        run: npm run build
        env:
          CI: false

      # ── Install server dependencies ───────────────────────────────────────
      - name: Install server dependencies
        working-directory: server
        run: npm ci --omit=dev

      # ── Download bundled Ollama binary ────────────────────────────────────
      - name: Create electron/bin directory
        run: mkdir -p electron/bin
        shell: bash

      - name: Download Ollama binary (${{ matrix.platform }})
        run: curl -L "${{ matrix.ollama_url }}" -o "${{ matrix.ollama_bin }}"
        shell: bash

      - name: Make Ollama binary executable (Linux/Mac)
        if: matrix.platform != 'win'
        run: chmod +x ${{ matrix.ollama_bin }}
        shell: bash

      # ── Build Electron app ────────────────────────────────────────────────
      - name: Install Electron dependencies
        working-directory: electron
        run: npm ci

      - name: Build Electron app (${{ matrix.platform }})
        working-directory: electron
        run: npm run build:${{ matrix.platform }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # ── Upload to GitHub Release ──────────────────────────────────────────
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_glob }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}