stages:
  - build
  - release

variables:
  GIT_LFS_SKIP_SMUDGE: "1"

.build_template: &build_template
  stage: build
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  artifacts:
    expire_in: 7 days
    paths:
      - electron/dist/

build-linux:
  <<: *build_template
  tags:
    - saas-linux-medium-amd64
  image: node:20-bullseye
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl
  script:
    - mkdir -p server/models
    - echo "Downloading GGUF model..."
    - curl -L "https://huggingface.co/bartowski/google_gemma-4-E2B-it-GGUF/resolve/main/google_gemma-4-E2B-it-Q4_K_M.gguf"
        -o server/models/gemma4.gguf --retry 3 --retry-delay 5
    - cd server/client && npm ci
    - CI=false npm run build
    - cd ../.. && cd server && npm ci --omit=dev
    - cd ../electron && npm ci
    - npx electron-builder --linux
      --config.extraResources.0.from=../server
      --config.extraResources.0.to=server
  environment:
    name: production

build-windows:
  <<: *build_template
  tags:
    - saas-windows-medium-amd64
  before_script:
    - choco install curl -y
  script:
    - mkdir -Force server/models
    - curl -L "https://huggingface.co/bartowski/google_gemma-4-E2B-it-GGUF/resolve/main/google_gemma-4-E2B-it-Q4_K_M.gguf"
        -o server/models/gemma4.gguf
    - cd server/client ; npm ci
    - $env:CI="false" ; npm run build
    - cd ../.. ; cd server ; npm ci --omit=dev
    - cd ../electron ; npm ci
    - npx electron-builder --win
  shell: powershell

build-mac:
  <<: *build_template
  tags:
    - saas-macos-medium-m1
  script:
    - mkdir -p server/models
    - curl -L "https://huggingface.co/bartowski/google_gemma-4-E2B-it-GGUF/resolve/main/google_gemma-4-E2B-it-Q4_K_M.gguf"
        -o server/models/gemma4.gguf --retry 3 --retry-delay 5
    - cd server/client && npm ci
    - CI=false npm run build
    - cd ../.. && cd server && npm ci --omit=dev
    - cd ../electron && npm ci
    - npx electron-builder --mac
      --config.mac.identity=null
  allow_failure: true

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  tags:
    - saas-linux-medium-amd64
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  needs:
    - job: build-linux
      artifacts: true
    - job: build-windows
      artifacts: true
  script:
    - echo "Creating release $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Edusaku $CI_COMMIT_TAG"
    description: "Offline AI Education Assistant — $CI_COMMIT_TAG"
    assets:
      links:
        - name: "Edusaku Linux (AppImage)"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/electron/dist/Edusaku-1.0.0.AppImage?job=build-linux"
          link_type: package
        - name: "Edusaku Windows (Installer)"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/electron/dist/Edusaku Setup 1.0.0.exe?job=build-windows"
          link_type: package