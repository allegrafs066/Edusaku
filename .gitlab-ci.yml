stages:
  - build
  - release

variables:
  GIT_LFS_SKIP_SMUDGE: "1"

build-linux:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  tags:
    - saas-linux-medium-amd64
  image: node:20-bullseye
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl
  script:
    - mkdir -p server/models
    - curl -L "https://huggingface.co/bartowski/google_gemma-4-E2B-it-GGUF/resolve/main/google_gemma-4-E2B-it-Q4_K_M.gguf"
        -o server/models/gemma4.gguf --retry 3 --retry-delay 5
    - cd server/client && npm ci
    - CI=false npm run build
    - cd ../.. && cd server && npm ci --omit=dev
    - cd ../electron && npm ci
    - npx electron-builder --linux --publish never
    - |
      APPIMAGE=$(ls dist/*.AppImage | head -1)
      curl --header "JOB-TOKEN: $CI_JOB_TOKEN" \
           --upload-file "$APPIMAGE" \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/edusaku/${CI_COMMIT_TAG}/Edusaku-linux.AppImage"
  artifacts:
    expire_in: 1 day
    paths:
      - electron/dist/*.AppImage

build-windows:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  tags:
    - saas-windows-medium-amd64
  variables:
    GENERATE_SOURCEMAP: "false"
  script:
    - mkdir -Force server/models
    - curl.exe -L "https://huggingface.co/bartowski/google_gemma-4-E2B-it-GGUF/resolve/main/google_gemma-4-E2B-it-Q4_K_M.gguf"
        -o server/models/gemma4.gguf
    - cd server/client ; npm ci
    - $env:CI = "false" ; $env:GENERATE_SOURCEMAP = "false" ; npm run build
    - cd ../.. ; cd server ; npm ci --omit=dev
    - cd ../electron ; npm ci
    - npx electron-builder --win --publish never
    - |
      $file = Get-ChildItem dist/*.zip | Select-Object -First 1
      curl.exe --header "JOB-TOKEN: $env:CI_JOB_TOKEN" `
               --upload-file $file.FullName `
               "$env:CI_API_V4_URL/projects/$env:CI_PROJECT_ID/packages/generic/edusaku/$env:CI_COMMIT_TAG/Edusaku-windows.zip"
  artifacts:
    expire_in: 1 day
    paths:
      - electron/dist/*.zip

build-mac:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  tags:
    - saas-macos-medium-m1
  script:
    - mkdir -p server/models
    - curl -L "https://huggingface.co/bartowski/google_gemma-4-E2B-it-GGUF/resolve/main/google_gemma-4-E2B-it-Q4_K_M.gguf"
        -o server/models/gemma4.gguf --retry 3 --retry-delay 5
    - cd server/client && npm ci
    - CI=false npm run build
    - cd ../.. && cd server && npm ci --omit=dev
    - cd ../electron && npm ci
    - npx electron-builder --mac --config.mac.identity=null --publish never
    - |
      DMG=$(ls dist/*.dmg | head -1)
      curl --header "JOB-TOKEN: $CI_JOB_TOKEN" \
           --upload-file "$DMG" \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/edusaku/${CI_COMMIT_TAG}/Edusaku-mac.dmg"
  allow_failure: true
  artifacts:
    expire_in: 1 day
    paths:
      - electron/dist/*.dmg

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  tags:
    - saas-linux-medium-amd64
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  needs:
    - job: build-linux
      artifacts: false
    - job: build-windows
      artifacts: false
  script:
    - echo "Creating release $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Edusaku $CI_COMMIT_TAG"
    description: "Offline AI Education Assistant — $CI_COMMIT_TAG"
    assets:
      links:
        - name: "Edusaku Linux (AppImage)"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/edusaku/${CI_COMMIT_TAG}/Edusaku-linux.AppImage"
          link_type: package
        - name: "Edusaku Windows (ZIP)"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/edusaku/${CI_COMMIT_TAG}/Edusaku-windows.zip"
          link_type: package